# 测试专用配置（覆盖 src/main/resources/application.yml 的同名键）
# Rules 06：测试用 H2 内存库，避免测试读写真实库（默认是内网 PostgreSQL，
# 更不能让单测往别人服务器上建表/插数据）造成串数据与脏库。
spring.datasource.url=jdbc:h2:mem:kuraedge-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 测试固定走 H2 的迁移脚本：与 application.yml 里 {vendor} 的解析结果一致，显式写死更稳
spring.flyway.locations=classpath:db/migration/h2
